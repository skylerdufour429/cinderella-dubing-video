<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Cinderella dub collection with language selector and MP4 downloads."
    />
    <title>Cinderella Dub Collection</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="page-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">Dub Collection</p>
          <h1>Cinderella</h1>
        </div>
        <div class="meta">
          <span>1950</span>
          <span>Walt Disney Productions</span>
          <span>Animated Feature</span>
        </div>
      </header>

      <main class="layout">
        <aside class="sidebar" aria-label="Language list">
          <label class="search-label" for="languageSearch">Search language</label>
          <input
            id="languageSearch"
            type="search"
            placeholder="Type a language..."
            autocomplete="off"
          />

          <div class="language-list-header">
            <h2>Available Languages</h2>
            <span id="languageCount" class="language-count">0</span>
          </div>

          <div id="languageList" class="language-list" aria-live="polite"></div>
        </aside>

        <section class="player-panel" aria-label="Video player section">
          <div class="player-header">
            <div>
              <p class="eyebrow">Language video player</p>
              <h2 id="selectedLanguageName">Albanian</h2>
            </div>

            <div class="action-buttons">
              <a id="openLink" class="secondary-btn" href="#" target="_blank" rel="noreferrer">
                Open MP4
              </a>
              <a id="downloadLink" class="primary-btn" href="#" download>
                Download MP4
              </a>
            </div>
          </div>

          <video
            id="videoPlayer"
            controls
            playsinline
            preload="metadata"
            aria-label="Selected language video player"
          ></video>
        </section>
      </main>
    </div>

    <script src="app.js"></script>
  </body>
</html>
